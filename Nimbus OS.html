<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimbus OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Fraunces:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--accent:#5b8cff;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fg:#16181d;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--line:rgba(0,0,0,.12);--bg2:#f4f5f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--fg:#f1f2f6;--glass:rgba(28,30,38,.58);--glass2:rgba(34,36,46,.88);--line:rgba(255,255,255,.14);--bg2:#1b1d25}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:var(--font);color:var(--fg);background:#000;-webkit-user-select:none;user-select:none}
#desk{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .6s}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid var(--line);font-size:13px;z-index:9000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);z-index:8999}
#bar>div{display:flex;align-items:center;gap:4px}
.mb{padding:3px 9px;border-radius:6px;cursor:default;white-space:nowrap}
.mb:hover,.mb.on{background:var(--line)}
#appname{font-weight:700}
#menu{position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:8px;min-width:200px;padding:5px;border-radius:10px;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9100;display:none}
#menu div{padding:6px 10px;border-radius:6px;font-size:13px}
#menu div:hover{background:var(--accent);color:#fff}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;border-radius:22px;background:var(--glass);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:9000;max-width:96vw;overflow-x:auto}
.di{position:relative;width:50px;height:50px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:27px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.25)}
.di:hover{transform:translateY(-9px) scale(1.2)}
.di.run::after{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--fg)}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.win{position:fixed;display:flex;flex-direction:column;min-width:260px;min-height:180px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.42);resize:both;overflow:hidden;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.win.max{inset:34px 0 0 0!important;width:auto!important;height:auto!important;border-radius:0;top:calc(30px + env(safe-area-inset-top,0px))!important}
.tb{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-bottom:1px solid var(--line);cursor:grab;flex:none;touch-action:none}
.tb b{flex:1;text-align:center;font-size:13px;font-weight:600;margin-right:50px}
.dots{display:flex;gap:7px}
.dots i{width:13px;height:13px;border-radius:50%;display:block;cursor:pointer}
.dots .x{background:#ff5f57}.dots .m{background:#febc2e}.dots .z{background:#28c840}
.bd{flex:1;overflow:auto;min-height:0;position:relative;-webkit-user-select:text;user-select:text}
.win:not(.top){box-shadow:0 10px 30px rgba(0,0,0,.28)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--bg2);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:#fff;border-color:transparent}
input[type=text],input[type=url],select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.pad{padding:16px;display:grid;gap:14px}
.pad h4{margin:0 0 8px;font-size:12px;font-weight:600;opacity:.65;text-transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:var(--fg)}
.wp{width:110px;height:68px;border-radius:9px;cursor:pointer;border:2px solid transparent;background-size:cover;background-position:center;position:relative}
.wp.on{border-color:var(--accent)}
.wp span{position:absolute;left:5px;bottom:3px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000}
textarea.note{width:100%;height:100%;border:0;outline:0;resize:none;padding:14px;background:transparent;font-size:15px;line-height:1.55}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;height:100%}
.calc output{grid-column:1/5;text-align:right;font-size:34px;padding:8px 6px;font-variant-numeric:tabular-nums;overflow:hidden}
.calc button{border:0;border-radius:10px;background:var(--bg2);font-size:19px;cursor:pointer}
.calc button.o{background:var(--accent);color:#fff}
.calc button:active{filter:brightness(1.2)}
.web{display:flex;flex-direction:column;height:100%}
.web .tool{display:flex;gap:6px;padding:7px;border-bottom:1px solid var(--line)}
.web input{flex:1}
.web iframe{flex:1;border:0;background:#fff;width:100%}
.wa{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.wa .di{width:38px;height:38px;font-size:20px;cursor:default}.wa .di:hover{transform:none}
.wa b{flex:1;font-weight:500}
#boot{position:fixed;inset:0;background:#07080c;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .8s}
#boot .logo{width:84px;height:84px;border-radius:24px;background:conic-gradient(from 200deg,#5b8cff,#b46bff,#ff7ab0,#ffb86b,#5b8cff);display:grid;place-items:center;font-size:40px;color:#fff;box-shadow:0 0 70px rgba(130,120,255,.55);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#boot h1{margin:0;font:600 26px/1 var(--font);letter-spacing:.04em;color:#fff}
#boot .pb{width:190px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
#boot .pb i{display:block;height:100%;width:0;background:#fff;border-radius:4px}
#boot small{color:rgba(255,255,255,.5);font-size:12px}
#icons{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));right:12px;bottom:90px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;gap:8px;align-content:flex-start;pointer-events:none;z-index:1}.ic{pointer-events:auto;width:84px;padding:6px 4px;border-radius:10px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);word-break:break-word;cursor:default}.ic span{display:block;font-size:38px;line-height:1.1}.ic:hover{background:rgba(255,255,255,.18)}
#ctx{position:fixed;display:none;min-width:180px;padding:5px;border-radius:10px;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9200}#ctx div{padding:6px 10px;border-radius:6px;font-size:13px}#ctx div:hover{background:var(--accent);color:#fff}#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#snap{position:fixed;display:none;border-radius:12px;background:color-mix(in srgb,var(--accent) 25%,transparent);border:2px solid var(--accent);z-index:8000;pointer-events:none}
.fg{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:8px;padding:12px;align-content:start}.web .fg{flex:1;overflow:auto}.fi{text-align:center;font-size:12px;padding:8px 4px;border-radius:10px;word-break:break-word}.fi span{display:block;font-size:34px}.fi:hover{background:var(--line)}
.lg{width:72px;height:72px;border-radius:20px;background:conic-gradient(from 200deg,#5b8cff,#b46bff,#ff7ab0,#ffb86b,#5b8cff);display:grid;place-items:center;font-size:34px;color:#fff}.pb2{width:260px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.pb2 i{display:block;height:100%;width:0;background:var(--accent)}.pb2[hidden]{display:none}
@keyframes unblur{from{filter:blur(24px);opacity:0;transform:scale(1.06)}}
@keyframes sTop{from{transform:translateY(-100%);filter:blur(12px);opacity:0}}
@keyframes sBot{from{transform:translate(-50%,150%);filter:blur(12px);opacity:0}}
@keyframes sRight{from{transform:translateX(70px);filter:blur(10px);opacity:0}}
body.in #desk{animation:unblur 1.2s cubic-bezier(.2,.7,.2,1) both}
body.in #bar{animation:sTop .9s cubic-bezier(.2,.8,.2,1) .25s both}
body.in #dock{animation:sBot .9s cubic-bezier(.2,.8,.2,1) .4s both}
body.in #icons{animation:sRight 1s cubic-bezier(.2,.8,.2,1) .6s both}
#spot{position:fixed;inset:0;display:none;z-index:9500;background:rgba(0,0,0,.25);padding-top:16vh}
#spot>div{width:min(560px,92vw);margin:0 auto;border-radius:16px;background:var(--glass2);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:pop .18s ease-out}
#spot input{width:100%;border:0;outline:0;background:transparent;padding:16px 18px;font-size:18px}
#spot .r{padding:9px 18px;display:flex;gap:12px;align-items:center;font-size:14px;cursor:default}#spot .r.on{background:var(--accent);color:#fff}
#toasts{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));right:12px;z-index:9300;display:grid;gap:8px;width:280px;max-width:calc(100vw - 24px);pointer-events:none}
.toast{padding:10px 14px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.35);font-size:13px;animation:tin .45s cubic-bezier(.2,.9,.3,1.2);transition:opacity .4s}.toast b{display:block;margin-bottom:2px}.toast div{opacity:.8}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
@media(max-width:700px){.win{inset:calc(34px + env(safe-area-inset-top,0px)) 0 84px 0!important;width:auto!important;height:auto!important;resize:none;border-radius:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>try{var s=JSON.parse(localStorage.getItem('nim:s'));document.documentElement.dataset.theme=(s&&s.theme)||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
</head>
<body>
<div id="desk"></div>
<div id="bar"><div><span class="mb" id="logo">◐ Nimbus</span><span class="mb" id="appname">Desktop</span></div><div><span class="mb" id="srch" title="Search (Ctrl or ⌘ K)">⌕</span><span class="mb" id="themebtn" title="Toggle light or dark">◑</span><span class="mb" id="clock"></span></div></div>
<div id="menu"></div><div id="icons"></div><div id="ctx"></div><div id="snap"></div><div id="spot"><div><input placeholder="Search apps, files, wallpapers, or type a sum" spellcheck="false" autocomplete="off"><div class="res"></div></div></div><div id="toasts"></div>
<div id="dock"></div>
<div id="boot"><div class="logo">◐</div><h1>Nimbus</h1><div class="pb"><i></i></div><small id="bootmsg">Starting up…</small></div>
<input type="file" id="up" accept="image/*" hidden>
<script>
const $=(s,e=document)=>e.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('nim:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('nim:'+k,JSON.stringify(v));return true}catch(e){return false}}};
const WALLS=[
{id:'aurora',n:'Aurora',css:'radial-gradient(60% 50% at 20% 25%,#35e0b0aa,transparent 70%),radial-gradient(55% 55% at 80% 20%,#7b5bffcc,transparent 70%),radial-gradient(70% 60% at 55% 95%,#ff5fa2aa,transparent 70%),#0b1030'},
{id:'dusk',n:'Dusk',css:'radial-gradient(circle at 50% 78%,#ffd27a 0,#ff8a5b 9%,transparent 30%),linear-gradient(#1c1b4b,#6a3c8f 45%,#ff7a6b 80%,#ffb36b)'},
{id:'grid',n:'Neon Grid',css:'repeating-linear-gradient(90deg,#ff3df522 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,#3dd8ff22 0 2px,transparent 2px 60px),radial-gradient(circle at 50% 100%,#ff3df5aa,transparent 55%),linear-gradient(#0a0220,#240a4d)'},
{id:'ocean',n:'Deep Sea',css:'radial-gradient(120% 60% at 50% 120%,#1fd1c1,transparent 60%),radial-gradient(80% 50% at 10% 0,#2b6dff99,transparent 70%),linear-gradient(#021a2e,#05405e)'},
{id:'meadow',n:'Meadow',css:'radial-gradient(90% 45% at 30% 100%,#2f8f46,transparent 70%),radial-gradient(90% 40% at 80% 105%,#1f6b3a,transparent 70%),linear-gradient(#9fd8ff,#e6f6d2 70%)'},
{id:'sand',n:'Dunes',css:'radial-gradient(120% 50% at 20% 100%,#c8793c,transparent 65%),radial-gradient(100% 45% at 90% 95%,#e5a15c,transparent 65%),linear-gradient(#ffe0b5,#f4b676)'},
{id:'ink',n:'Ink',css:'conic-gradient(from 210deg at 50% 120%,#111,#2a2a35,#111 40%,#3b2a55,#111)'},
{id:'candy',n:'Candy',css:'radial-gradient(50% 50% at 15% 20%,#ffb3d9,transparent 70%),radial-gradient(50% 50% at 85% 30%,#b3d9ff,transparent 70%),radial-gradient(60% 60% at 50% 90%,#d9ffb3,transparent 70%),#fff4fb'}];
WALLS.push({id:'stars',n:'Starfield',css:'#04050f',anim:'stars'},{id:'rain',n:'Code Rain',css:'#020a05',anim:'rain'});
const ACCENTS=['#5b8cff','#a46bff','#ff5f8f','#ff8a3d','#24c48a','#18b6d6','#8e8e93'];
const FONTS=[['Inter','Inter'],['Space Grotesk','Space Grotesk'],['DM Sans','DM Sans'],['Fraunces','Fraunces (serif)'],['JetBrains Mono','JetBrains Mono']];
let S=Object.assign({theme:document.documentElement.dataset.theme,accent:ACCENTS[0],font:'Inter',wall:'aurora',custom:null,web:[],note:''},store.get('s',{}));
const save=()=>store.set('s',S);
function apply(){const r=document.documentElement;r.dataset.theme=S.theme;r.style.setProperty('--accent',S.accent);r.style.setProperty('--font',`'${S.font}',system-ui,-apple-system,'Segoe UI',sans-serif`);
 const w=WALLS.find(x=>x.id===S.wall);$('#desk').style.background=(S.wall==='custom'&&S.custom)?`url(${S.custom}) center/cover`:(w||WALLS[0]).css;anim(S.wall==='custom'?0:(w||{}).anim)}
const tile=(a)=>`background:${a.c}`;
/* ---------- apps ---------- */
const APPS={
 browser:{n:'Browser',i:'🧭',c:'linear-gradient(135deg,#4facfe,#00c6ff)',w:760,h:520,r:(b)=>web(b,'https://en.m.wikipedia.org',true)},
 webapps:{n:'Web Apps',i:'🧩',c:'linear-gradient(135deg,#a18cd1,#fbc2eb)',w:480,h:480,r:webAppsApp},
 notes:{n:'Notes',i:'📝',c:'linear-gradient(135deg,#f6d365,#fda085)',w:420,h:420,r:b=>{b.innerHTML='<textarea class="note" placeholder="Start typing. Notes save automatically."></textarea>';const t=$('textarea',b);t.value=S.note;t.oninput=()=>{S.note=t.value;save()}}},
 calc:{n:'Calculator',i:'🧮',c:'linear-gradient(135deg,#434343,#000)',w:300,h:430,r:calcApp},
 paint:{n:'Sketch',i:'🎨',c:'linear-gradient(135deg,#ff9a9e,#fad0c4)',w:520,h:420,r:paintApp},
 files:{n:'Files',i:'📁',c:'linear-gradient(135deg,#56ccf2,#2f80ed)',w:600,h:440,r:filesApp},
 terminal:{n:'Terminal',i:'⌨️',c:'linear-gradient(135deg,#2c3e50,#000)',w:640,h:400,r:termApp},
 update:{n:'Software Update',i:'⬆️',c:'linear-gradient(135deg,#43e97b,#38f9d7)',w:480,h:400,r:updateApp},
 settings:{n:'Settings',i:'⚙️',c:'linear-gradient(135deg,#bdc3c7,#6b7b8c)',w:600,h:540,r:settingsApp}};
const pinned=['files','terminal','browser','webapps','notes','calc','paint','settings'];
const getApp=id=>APPS[id]||(id.startsWith('edit:')?{n:id.split('/').pop(),i:'📄',c:'#888',w:460,h:360,r:b=>editor(b,id.slice(5))}:0)||(()=>{const a=S.web.find(x=>'web:'+x.id===id);return a&&{n:a.n,i:a.i,c:'linear-gradient(135deg,#667eea,#764ba2)',w:820,h:560,r:b=>web(b,a.u,false)}})();
function web(b,url,bar){b.innerHTML=`<div class="web">${bar?'<div class="tool"><input type="text" value="" aria-label="Address"><button class="btn p">Go</button><button class="btn" title="Open in a new tab">↗</button></div>':''}<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe></div>`;
 const f=$('iframe',b),go=u=>{if(!/^https?:\/\//i.test(u))u='https://'+u;f.src=u;if(bar)$('input',b).value=u;f.dataset.u=u};go(url);
 if(bar){$('input',b).onkeydown=e=>e.key==='Enter'&&go(e.target.value);$('.p',b).onclick=()=>go($('input',b).value);$('.btn:last-child',b).onclick=()=>window.open(f.dataset.u,'_blank','noopener')}}
function webAppsApp(b){const draw=()=>{b.innerHTML=`<div class="pad"><div><h4>Your web apps</h4><div class="pad" style="padding:0;gap:8px" id="wl"></div></div><div><h4>Add a web app</h4><div class="row"><input type="text" id="wi" placeholder="🌐" style="width:54px;text-align:center"><input type="text" id="wn" placeholder="Name" style="flex:1"><input type="url" id="wu" placeholder="https://example.com" style="flex:2;min-width:150px"><button class="btn p" id="wa">Add to dock</button></div><p style="font-size:12px;opacity:.65;margin:10px 0 0;line-height:1.5">Web apps open in their own window. Some sites refuse to be embedded; if one stays blank, use the ↗ button in the Browser to open it in a new tab.</p></div></div>`;
 const l=$('#wl',b);S.web.forEach(a=>{const d=document.createElement('div');d.className='wa';d.innerHTML=`<span class="di" style="background:linear-gradient(135deg,#667eea,#764ba2)">${a.i}</span><b>${a.n}</b><button class="btn">Open</button><button class="btn">Remove</button>`;const [o,x]=d.querySelectorAll('button');o.onclick=()=>openApp('web:'+a.id);x.onclick=()=>{closeWin('web:'+a.id);S.web=S.web.filter(z=>z.id!==a.id);save();dock();draw()};l.append(d)});
 if(!S.web.length)l.innerHTML='<div style="opacity:.6;font-size:13px">Nothing here yet. Add your first one below.</div>';
 $('#wa',b).onclick=()=>{let u=$('#wu',b).value.trim(),n=$('#wn',b).value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;try{n=n||new URL(u).hostname.replace(/^www\./,'')}catch(e){return}S.web.push({id:Date.now().toString(36),n,u,i:$('#wi',b).value.trim()||'🌐'});save();dock();draw()}};draw()}
function calcApp(b){b.innerHTML='<div class="calc"><output>0</output></div>';const g=$('.calc',b),o=$('output',b);let e='';
 'C ( ) /;7 8 9 *;4 5 6 -;1 2 3 +;0 . % ='.split(';').join(' ').split(' ').forEach(k=>{const x=document.createElement('button');x.textContent=k;if('/*-+='.includes(k))x.className='o';x.onclick=()=>{if(k==='C')e='';else if(k==='='){try{if(/^[0-9+\-*/.()% ]+$/.test(e))e=String(+(Function('return '+e.replace(/%/g,'/100'))()).toFixed(10))}catch(_){e='Error'}}else{if(e==='Error')e='';e+=k}o.textContent=e||'0'};g.append(x)})}
function paintApp(b){b.innerHTML='<div style="display:flex;flex-direction:column;height:100%"><div class="row" style="padding:7px;border-bottom:1px solid var(--line)"><input type="color" value="#5b8cff"><input type="range" min="1" max="30" value="4"><button class="btn">Clear</button></div><canvas style="flex:1;width:100%;background:#fff;touch-action:none"></canvas></div>';
 const c=$('canvas',b),x=c.getContext('2d'),[col,sz]=b.querySelectorAll('input');let d=false;
 const fit=()=>{const r=c.getBoundingClientRect();if(c.width!==r.width|0){const img=x.getImageData(0,0,c.width,c.height);c.width=r.width;c.height=r.height;x.putImageData(img,0,0)}};new ResizeObserver(fit).observe(c);
 const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointerup=()=>d=false;

function spotRender(){sel=spotFind(sin.value);si=Math.min(si,Math.max(0,sel.length-1));sres.innerHTML='';sel.forEach((r,i)=>{const d=document.createElement('div');d.className='r'+(i===si?' on':'');d.innerHTML=`<span style="font-size:20px">${r[2]}</span><b style="font-weight:500">${esc(r[0])}</b><span style="margin-left:auto;font-size:12px;opacity:.7">${esc(r[1])}</span>`;d.onclick=()=>go(i);sres.append(d)})}
const go=i=>{const r=sel[i];hideSpot();r&&r[3]()};
function showSpot(){spot.style.display='block';sin.value='';si=0;spotRender();sin.focus()}
function hideSpot(){spot.style.display='none'}
sin.oninput=()=>{si=0;spotRender()};
sin.onkeydown=e=>{if(e.key==='ArrowDown'){si=Math.min(sel.length-1,si+1);spotRender();e.preventDefault()}else if(e.key==='ArrowUp'){si=Math.max(0,si-1);spotRender();e.preventDefault()}else if(e.key==='Enter')go(si)};
spot.onpointerdown=e=>{if(e.target===spot)hideSpot()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();spot.style.display==='block'?hideSpot():showSpot()}else if(e.key==='Escape')hideSpot()});
$('#srch').onclick=showSpot;
apply();dock();icons();boot();
setTimeout(()=>checkUpdate().then(r=>{if(r&&r.new){$('#logo').textContent='◐ Nimbus •';toast('Update available','Nimbus '+r.v+' is ready to install.',()=>openApp('update'))}}),6500);
</script>
